<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THE WASH 清掃スタッフ</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --bg: #f0f2f5; --card: #fff; --ink: #1a1a1a; --sub: #5f6368; --line: #dadce0;
    --blue: #1a73e8; --blue-bg: #e8f0fe; --orange: #e8710a; --orange-bg: #fef1e6;
    --green: #188038; --green-bg: #e6f4ea; --red: #c5221f; --red-bg: #fce8e6;
    --yellow: #b06000; --yellow-bg: #fef7e0; --gray-bg: #f1f3f4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: 15px; padding-bottom: 84px; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 12px 16px; }
  .wrap.wide { max-width: 1100px; }
  header { background: var(--blue); color: #fff; padding: 12px 16px; }
  header .in { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  header b { font-size: 16px; }
  header small { opacity: .85; font-size: 12px; display: block; }
  #clock { font-size: 22px; font-weight: bold; letter-spacing: 1px; font-variant-numeric: tabular-nums; }

  .card { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid var(--line); }
  .card h3 { margin: 0 0 10px; font-size: 15px; }
  .muted { color: var(--sub); font-size: 13px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .chip { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: bold; white-space: nowrap; }
  .c-ok { background: var(--green-bg); color: var(--green); }
  .c-yet { background: var(--yellow-bg); color: var(--yellow); }
  .c-ng { background: var(--red-bg); color: var(--red); }
  .c-blue { background: var(--blue-bg); color: var(--blue); }
  .c-gray { background: var(--gray-bg); color: var(--sub); }

  label { font-size: 13px; font-weight: bold; display: block; margin: 12px 0 6px; color: var(--sub); }
  select, input, textarea { width: 100%; padding: 12px; font-size: 16px; border: 1.5px solid var(--line);
    border-radius: 10px; background: #fff; font-family: inherit; color: var(--ink); }
  textarea { min-height: 70px; }
  button { font-family: inherit; cursor: pointer; }
  .btn { border: none; border-radius: 10px; padding: 12px 14px; font-size: 15px; font-weight: bold; color: #fff; background: var(--blue); }
  .btn.green { background: var(--green); } .btn.orange { background: var(--orange); }
  .btn.ghost { background: var(--gray-bg); color: var(--ink); }
  .btn.red { background: var(--red); }
  .btn.sm { padding: 7px 10px; font-size: 13px; border-radius: 8px; }
  .btn:disabled { opacity: .45; }
  .btn.block { width: 100%; }
  .btns { display: flex; gap: 10px; }
  .btns > * { flex: 1; }
  .punch { padding: 22px 0; font-size: 20px; border-radius: 14px; }
  .punch small { display: block; font-size: 12px; font-weight: normal; opacity: .9; margin-top: 2px; }

  .seg { display: flex; background: var(--gray-bg); border-radius: 10px; padding: 3px; gap: 3px; overflow-x: auto; }
  .seg button { flex: 1; border: none; background: transparent; padding: 9px 10px; border-radius: 8px; font-size: 14px; font-weight: bold; color: var(--sub); white-space: nowrap; }
  .seg button.on { background: #fff; color: var(--blue); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

  .checks .ci { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border: 1.5px solid var(--line);
    border-radius: 10px; margin-bottom: 6px; background: #fff; font-size: 15px; user-select: none; }
  .checks .ci.on { border-color: var(--green); background: var(--green-bg); color: var(--green); font-weight: bold; }
  .checks .ci i { font-style: normal; width: 22px; text-align: center; }

  /* カレンダー */
  .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .cal-head b { font-size: 17px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal .dow { text-align: center; font-size: 11px; font-weight: bold; color: var(--sub); padding: 3px 0; }
  .cal .dow.su, .cal .d.su .n { color: var(--red); } .cal .dow.sa, .cal .d.sa .n { color: var(--blue); }
  .cal .d { min-height: 54px; background: #fff; border: 1px solid #e8eaed; border-radius: 8px; padding: 3px 2px;
    display: flex; flex-direction: column; align-items: center; font-size: 14px; user-select: none; }
  .cal .d.x { background: transparent; border: none; }
  .cal .d.today { border: 2px solid var(--blue); }
  .cal .d.past { opacity: .55; }
  .cal .d .tag { font-size: 10px; font-weight: bold; border-radius: 4px; padding: 0 3px; margin-top: 2px; white-space: nowrap; }
  .cal .d.want { background: var(--yellow-bg); border-color: #f9d27a; }
  .cal .d.fixd { background: var(--green-bg); border-color: #a8d5b5; }
  .cal .d.ng { background: var(--gray-bg); }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--sub); margin-top: 8px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; background: var(--c); }

  .list .it { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid #f1f3f4; }
  .list .it:last-child { border-bottom: none; }

  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line);
    display: flex; padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
  nav.tabs button { flex: 1; border: none; background: none; padding: 9px 0 8px; font-size: 11px; color: var(--sub); font-weight: bold; position: relative; }
  nav.tabs button .ic { display: block; font-size: 20px; line-height: 1.2; }
  nav.tabs button.on { color: var(--blue); }
  nav.tabs .badge { position: absolute; top: 4px; left: 55%; background: var(--red); color: #fff; font-size: 10px; border-radius: 99px; padding: 0 5px; }

  #toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); max-width: 90%; background: #202124; color: #fff;
    padding: 12px 16px; border-radius: 10px; font-size: 14px; z-index: 50; display: none; text-align: center; line-height: 1.5; }
  #toast.err { background: var(--red); }
  #loading { position: fixed; inset: 0; background: rgba(255,255,255,.6); display: none; align-items: center; justify-content: center; z-index: 40; }
  #loading div { width: 36px; height: 36px; border: 4px solid var(--blue-bg); border-top-color: var(--blue); border-radius: 50%; animation: sp 0.8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: flex-end; justify-content: center; z-index: 30; }
  .modal { background: #fff; width: 100%; max-width: 520px; border-radius: 16px 16px 0 0; padding: 16px; max-height: 88vh; overflow-y: auto; }
  @media (min-width: 700px) { .modal-bg { align-items: center; } .modal { border-radius: 16px; } }

  /* 管理：KPI */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .kpi { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; }
  .kpi .v { font-size: 26px; font-weight: bold; font-variant-numeric: tabular-nums; }
  .kpi .l { font-size: 12px; color: var(--sub); }
  .kpi.alert .v { color: var(--red); }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .filters select, .filters input { width: auto; padding: 8px 10px; font-size: 14px; }
  .filters label { margin: 0; display: flex; gap: 4px; align-items: center; font-size: 13px; }
  .filters input[type=checkbox] { width: auto; }

  /* 管理：表 */
  .tbl-wrap { overflow-x: auto; background: #fff; border: 1px solid var(--line); border-radius: 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid #f1f3f4; text-align: left; white-space: nowrap; }
  th { background: #f8f9fa; font-size: 12px; color: var(--sub); position: sticky; top: 0; cursor: pointer; user-select: none; }
  th.sorted::after { content: " ▼"; } th.sorted.asc::after { content: " ▲"; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.bad td { background: #fffaf5; }

  /* 管理：シフト表 */
  .grid { border-collapse: separate; border-spacing: 0; }
  .grid th, .grid td { padding: 0; border-bottom: 1px solid #eee; border-right: 1px solid #f3f3f3; text-align: center; }
  .grid th { padding: 4px 0; min-width: 32px; cursor: default; }
  .grid th.su { color: var(--red); } .grid th.sa { color: var(--blue); }
  .grid .nm { position: sticky; left: 0; background: #fff; z-index: 2; text-align: left; padding: 6px 8px; min-width: 112px; font-weight: bold; font-size: 12px; }
  .grid thead .nm { background: #f8f9fa; z-index: 3; }
  .grid td.cell { width: 32px; height: 34px; cursor: pointer; font-size: 11px; font-weight: bold; }
  .grid td.cell.want { background: var(--yellow-bg); color: var(--yellow); }
  .grid td.cell.fixd { background: var(--green-bg); color: var(--green); }
  .grid td.cell.ng { background: var(--gray-bg); color: #999; }
  .grid td.cell.today { box-shadow: inset 0 0 0 2px var(--blue); }
  .grid tr.tot td { font-size: 11px; color: var(--sub); }
  .stores-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .hide { display: none !important; }
</style>
</head>
<body>

<header><div class="in">
  <div><b>THE WASH 清掃スタッフ</b><small id="who">読み込み中…</small></div>
  <div id="clock">--:--</div>
</div></header>

<main id="app"></main>

<nav class="tabs hide" id="tabs"></nav>
<div id="toast"></div>
<div id="loading"><div></div></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<!-- ローカルのデモ確認用（実名）。GitHub Pages には置かないので本番では読み込まれない -->
<script>if (location.protocol === 'file:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) document.write('<script src="demo_names.js"><\/script>');</script>
<script>
/* =========================================================
 * 設定（導入時にここだけ書き換える）
 * =======================================================*/
const LIFF_ID = '2012412898-anSeFfTz';   // LINEミニアプリ「THE WASH 清掃スタッフ」開発用のLIFF ID（審査通過後は本番用 2012412900-PdZ6VdSc に差し替え）
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyGkZxU3PHvUhova2UuBkLWAx0ntO1g8OpQCH3V9fraozHEDWhwHgvuQ30Vbqiu5nvoQA/exec';   // 清掃打刻スプレッドシートのGASウェブアプリ

// LIFF_ID が空、または URL に ?demo=1 を付けると、端末内のダミーデータで動くデモモード（見た目確認用）
const DEMO = !LIFF_ID || new URLSearchParams(location.search).has('demo');

/* =========================================================
 * 状態
 * =======================================================*/
const S = {
  me: null, tab: 'punch', store: null, checks: {}, home: null,
  ym: ymOf(new Date()), month: null, shiftStore: null, shiftSel: null, hStore: '',
  admin: null, aym: ymOf(new Date()), aStore: '', aStaff: '', onlyBad: false, sort: { key: 'date', asc: true }, sumView: 'staff'
};

/* =========================================================
 * 共通
 * =======================================================*/
const $ = s => document.querySelector(s);
// localStorage が使えない環境（プライベートモード等）でも落ちないように
const kv = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { } } };
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function ymOf(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function addYm(ym, k) { const [y, m] = ym.split('-').map(Number); return ymOf(new Date(y, m - 1 + k, 1)); }
function ymLabel(ym) { const [y, m] = ym.split('-'); return y + '年' + Number(m) + '月'; }
function ds(d) { return d.getFullYear() + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0'); }
function dLabel(s) { const d = new Date(s); return (d.getMonth() + 1) + '/' + d.getDate() + '(' + '日月火水木金土'[d.getDay()] + ')'; }
function toMin(t) { const [h, m] = String(t).split(':').map(Number); return h * 60 + m; }
function hm(min) { return Math.floor(min / 60) + ':' + String(min % 60).padStart(2, '0'); }
function daysOf(ym) { const [y, m] = ym.split('-').map(Number); const n = new Date(y, m, 0).getDate(); return Array.from({ length: n }, (_, i) => ds(new Date(y, m - 1, i + 1))); }

let toastT;
function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block';
  clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', err ? 5000 : 3000);
}
function loading(on) { $('#loading').style.display = on ? 'flex' : 'none'; }
function modal(html) { $('#modal').innerHTML = html; $('#modalBg').style.display = html ? 'flex' : 'none'; }
$('#modalBg').addEventListener('click', e => { if (e.target.id === 'modalBg') modal(''); });

setInterval(() => { const d = new Date(); $('#clock').textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }, 1000);

/** API呼び出し：LIFFのIDトークンを付けてGASにPOST */
async function api(action, params = {}, quiet) {
  if (!quiet) loading(true);
  try {
    if (DEMO) return await Demo.call(action, params);
    const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action, params, idToken: liff.getIDToken() }) });
    const j = await res.json();
    if (!j.ok) {
      // LINEアプリ内では liff.login() が使えないので、ログアウト→再読み込みで新しいトークンを取り直す
      if (j.error === 'LOGIN_EXPIRED') { toast('ログインの有効期限が切れました。開き直します', true); setTimeout(() => { liff.logout(); liff.isInClient() ? location.reload() : liff.login({ redirectUri: location.href }); }, 1200); }
      throw new Error(j.error);
    }
    return j.data;
  } catch (e) {
    toast(e.message === 'Failed to fetch' ? '通信できませんでした。電波を確認してもう一度' : e.message, true);
    throw e;
  } finally { if (!quiet) loading(false); }
}

/* =========================================================
 * 起動
 * =======================================================*/
async function boot() {
  try {
    if (!DEMO) {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    }
    S.me = await api('me');
    route();
  } catch (e) {
    $('#app').innerHTML = `<div class="wrap"><div class="card"><h3>起動できませんでした</h3><p class="muted">${esc(e.message)}</p>
      <button class="btn block" onclick="location.reload()">再読み込み</button></div></div>`;
  }
}

function route() {
  const me = S.me;
  $('#who').textContent = me.profile ? me.profile.name + (me.profile.role === 'admin' ? '（管理者）' : '') : (me.lineName || '');
  if (me.status !== '承認') return renderGate();
  S.hq = !me.profile.stores.length;   // 店舗に入らない本部管理者
  if (S.hq && me.profile.role !== 'admin') {
    $('#app').innerHTML = `<div class="wrap"><div class="card"><h3>担当店舗が未設定です</h3><p class="muted">管理者に担当店舗の設定を依頼してください。</p></div></div>`;
    return;
  }
  if (S.hq) { S.tab = 'admin'; renderTabs(); return go('admin'); }
  S.store = S.store || kv.get('store') || me.profile.stores[0];
  if (me.profile.stores.indexOf(S.store) < 0) S.store = me.profile.stores[0];
  S.shiftStore = S.shiftStore || S.store;
  renderTabs();
  go(S.tab);
}

/* ---------- 未登録・承認待ち ---------- */
function renderGate() {
  $('#tabs').classList.add('hide');
  const me = S.me;
  if (me.status === '申請中') {
    $('#app').innerHTML = `<div class="wrap"><div class="card"><h3>⏳ 承認待ちです</h3>
      <p>管理者が承認すると使えるようになります。承認されたらこの画面を開き直してください。</p>
      <button class="btn block" onclick="location.reload()">開き直す</button></div></div>`;
    return;
  }
  if (me.status === '停止') {
    $('#app').innerHTML = `<div class="wrap"><div class="card"><h3>利用停止中です</h3><p class="muted">管理者に連絡してください。</p></div></div>`;
    return;
  }
  const free = me.freeNames || {};
  const opts = me.config.stores.map(s => `<option>${esc(s)}</option>`).join('') + `<option value="">店舗なし（本部・管理者）</option>`;
  $('#app').innerHTML = `<div class="wrap"><div class="card"><h3>はじめに：スタッフ登録</h3>
    <p class="muted">LINEアカウントとスタッフ名を紐付けます（最初の1回だけ）。</p>
    <label>担当店舗</label><select id="rgStore" onchange="rgNames()">${opts}</select>
    <label>あなたの名前</label><select id="rgName" onchange="rgToggle()"></select>
    <div id="rgFreeBox" class="hide"><label>名前（フルネーム）</label><input id="rgFree" placeholder="例：山田 花子"></div>
    <button class="btn green block" style="margin-top:16px" onclick="doRegister()">登録を申請する</button></div></div>`;
  window.rgNames = () => {
    const names = free[$('#rgStore').value] || [];
    $('#rgName').innerHTML = names.map(n => `<option>${esc(n)}</option>`).join('') + `<option value="__new">リストにない（入力する）</option>`;
    rgToggle();
  };
  window.rgToggle = () => $('#rgFreeBox').classList.toggle('hide', $('#rgName').value !== '__new');
  rgNames();
}
async function doRegister() {
  const sel = $('#rgName').value;
  const name = sel === '__new' ? $('#rgFree').value.trim() : sel;
  if (!name) return toast('名前を入力してください', true);
  if (!confirm(`「${name}」で登録を申請します`)) return;
  const msg = await api('register', { name, store: $('#rgStore').value });
  toast(msg);
  S.me = await api('me'); route();
}

/* ---------- タブ ---------- */
function renderTabs() {
  const t = S.hq ? [] : [['punch', '⏱', '打刻'], ['shift', '📅', 'シフト'], ['hist', '📋', '履歴']];
  if (S.me.profile.role === 'admin') t.push(['admin', '🛠', '管理']);
  $('#tabs').innerHTML = t.map(([k, ic, l]) => `<button data-k="${k}" onclick="go('${k}')"><span class="ic">${ic}</span>${l}<span class="badge hide" id="bd_${k}"></span></button>`).join('');
  $('#tabs').classList.remove('hide');
}
function go(tab) {
  S.tab = tab;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.k === tab));
  $('#app').innerHTML = '<div class="wrap"></div>';
  if (tab === 'shift') S.ym = openYm();
  ({ punch: loadPunch, shift: loadShift, hist: loadHist, admin: loadAdmin })[tab]();
  window.scrollTo(0, 0);
}

/* =========================================================
 * スタッフ：打刻
 * =======================================================*/
async function loadPunch() { S.home = await api('home'); renderPunch(); }
function renderPunch() {
  const h = S.home, me = S.me.profile, cfg = S.me.config;
  const st = h.stores.find(x => x.store === S.store) || h.stores[0];
  const storeSel = me.stores.length > 1
    ? `<div class="seg" style="margin-bottom:12px">${me.stores.map(s => `<button class="${s === S.store ? 'on' : ''}" onclick="pickStore('${esc(s)}')">${esc(s)}</button>`).join('')}</div>`
    : `<div class="muted" style="margin-bottom:8px">店舗：<b>${esc(S.store)}</b></div>`;
  const inDone = !!st.inTime, outDone = !!st.outTime;
  const others = h.stores.filter(x => x.store !== S.store && (x.inTime || x.outTime));
  $('#app').innerHTML = `<div class="wrap">
    ${storeSel}
    <div class="card">
      <div class="row"><h3 style="margin:0">今日 ${dLabel(h.today)}</h3>
        ${outDone ? '<span class="chip c-ok">完了</span>' : inDone ? '<span class="chip c-blue">清掃中</span>' : '<span class="chip c-yet">未出勤</span>'}</div>
      <div class="list" style="margin-top:6px">
        <div class="it"><span>出勤</span><b>${st.inTime || '—'}</b></div>
        <div class="it"><span>退勤</span><b>${st.outTime || '—'}</b></div>
        ${inDone && outDone ? `<div class="it"><span>作業時間</span><b>${hm(Math.max(0, toMin(st.outTime) - toMin(st.inTime)))}</b></div>` : ''}
      </div>
      ${st.todayShift.length ? `<div class="muted" style="margin-top:6px">今日のシフト：${st.todayShift.map(esc).join('・')}</div>` : `<div class="muted" style="margin-top:6px">今日この店舗の確定シフトはありません</div>`}
    </div>

    <div class="card ${inDone && !outDone ? '' : 'hide'}">
      <h3>清掃チェック（退勤前に）</h3>

/** 勤怠の行（店舗×スタッフ×日）＋異常判定 */
// 打刻位置と店舗の距離（m）。位置なし・店舗座標なしは -1
function storeDist(store, p) {
  const g = (S.me.config.geo || {})[store];
  if (!g || !p || !p.lat || !p.lng) return -1;
  const rad = x => x * Math.PI / 180, dLat = rad(p.lat - g[0]), dLng = rad(p.lng - g[1]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(g[0])) * Math.cos(rad(+p.lat)) * Math.sin(dLng / 2) ** 2;
  return Math.round(12742000 * Math.asin(Math.sqrt(h)));
}
function attRows() {
  const a = A(), pre = S.aym.replace('-', '/') + '/', today = a.today;
  const m = {};
  const key = (d, st, n) => d + '|' + st + '|' + n;
  a.shifts.filter(s => s.date.startsWith(pre) && s.status === '確定').forEach(s => {
    (m[key(s.date, s.store, s.staff)] = m[key(s.date, s.store, s.staff)] || { date: s.date, store: s.store, staff: s.staff }).plan = true;
  });
  a.punches.filter(p => p.date.startsWith(pre)).forEach(p => {
    const o = m[key(p.date, p.store, p.staff)] = m[key(p.date, p.store, p.staff)] || { date: p.date, store: p.store, staff: p.staff };
    o[p.type === '出勤' ? 'in' : 'out'] = p.time;
    if (p.type === '出勤') o.inP = p; else o.outP = p;
    if (p.kind && p.kind !== 'LIFF') o.edited = (o.edited ? o.edited + '・' : '') + p.kind;
  });
  return Object.values(m).map(o => {
    o.min = o.in && o.out ? Math.max(0, toMin(o.out) - toMin(o.in)) : null;
    const f = [];
    if (o.plan && !o.in && !o.out && o.date < today) f.push('欠勤?');
    if (o.in && !o.out && o.date < today) f.push('退勤漏れ');
    if (!o.in && o.out) f.push('出勤漏れ');
    if (!o.plan && (o.in || o.out)) f.push('シフト外');
    if (o.min != null && o.min < 15) f.push('短時間');
    o.dist = Math.max(storeDist(o.store, o.inP), storeDist(o.store, o.outP));
    if (o.dist >= (S.me.config.geoRadius || 200)) f.push('店舗外');
    o.flags = f;
    o.checks = o.outP ? o.outP.checks : '';
    o.checkNg = o.outP && o.outP.kind === 'LIFF' && (o.checks ? o.checks.split('、').length : 0) < S.me.config.checklist.length;
    if (o.checkNg) f.push('チェック不足');
    return o;
  });
}

/** スタッフ別集計 */
function sumRows() {
  // スタッフ×店舗で1行（掛け持ちは店舗ごとに分ける）
  const a = A(), rows = attRows(), m = {};
  const row = (staff, store) => ({ staff, stores: store, plan: 0, days: 0, min: 0, bad: 0, prev: a.prevDays[staff + '|' + store] || 0 });
  // 停止（退職）者は、その月に打刻・シフトがある時だけ行が出る（下の rows で作られる）
  a.staff.filter(s => s.status !== '停止').forEach(s => s.stores.forEach(st => m[s.name + '|' + st] = row(s.name, st)));
  rows.forEach(r => {
    const k = r.staff + '|' + r.store, o = m[k] = m[k] || row(r.staff, r.store);
    if (r.plan) o.plan++;
    if (r.in) o.days++;
    if (r.min) o.min += r.min;
    if (r.flags.length) o.bad++;
  });
  return Object.values(m).filter(o => !S.aStore || o.stores === S.aStore);
}

      let fixed = 0;
      const tds = days.map(d => {
        const s = a.shifts.find(x => x.date === d && x.store === st && x.staff === n);
        const cls = !s ? '' : s.status === '確定' ? 'fixd' : s.status === '希望' ? 'want' : 'ng';
        if (s && s.status === '確定') fixed++;
        const lbl = !s ? '' : s.status === '確定' ? '●' : s.status === '希望' ? '希' : '×';
        return `<td class="cell ${cls} ${d === today ? 'today' : ''}" onclick="cellTap('${d}','${esc(st)}','${esc(n)}')">${lbl}</td>`;
      }).join('');
      return `<tr><td class="nm">${esc(n)}</td>${tds}<td class="num"><b>${fixed}</b></td></tr>`;
    }).join('');
    const tot = days.map(d => {
      const c = a.shifts.filter(x => x.date === d && x.store === st && x.status === '確定').length;
      return `<td style="${c ? '' : 'color:var(--red);font-weight:bold'}">${c || '0'}</td>`;
    }).join('');
    return `<h3 style="margin:14px 0 6px">${esc(st)}</h3><div class="tbl-wrap"><table class="grid"><thead>${head}</thead><tbody>${body}
      <tr class="tot"><td class="nm">確定人数</td>${tot}<td></td></tr></tbody></table></div>`;
  }).join('');
  $('#aBody').innerHTML = `<div class="legend" style="margin-bottom:6px"><span style="--c:#fef7e0">希＝希望</span><span style="--c:#e6f4ea">●＝確定</span><span style="--c:#f1f3f4">×＝不可</span><span>セルをタップで変更／確定人数0の日は赤</span></div>` + html;
}

/* ---------- CSV ---------- */
function csv(name, head, rows) {
  const body = [head].concat(rows).map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const blob = new Blob(['﻿' + body], { type: 'text/csv' });
  if (!DEMO && liff.isInClient()) {
    // LINE内ブラウザはダウンロード不可 → 外部ブラウザで開くよう案内
    return toast('CSVはPCかスマホのブラウザで管理画面を開いて出力してください（LINE内では保存不可）', true);
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}
function dlSumCsv() {
  csv(`清掃勤怠集計_${S.aym}.csv`, ['対象月', 'スタッフ', '店舗', '予定日数', '実績日数', '差', '前月実績', '作業時間(分)', '作業時間(h:mm)', '異常件数'],

    attRows().filter(r => !S.aStore || r.store === S.aStore).sort((x, y) => x.date > y.date ? 1 : -1)

  const GEO = { '下到津店': [33.879951, 130.856689], '長府店': [34.009048, 130.992157], '星ヶ丘店': [33.774166, 130.748566], '水巻町店': [33.851006, 130.694839],
    '頓野店': [33.753258, 130.749222], '曽根店': [33.845432, 130.945541], '白銀店': [33.870144, 130.874329], '宗像店': [33.792377, 130.530365], '中間店': [33.829113, 130.710190], '熊本町店': [33.868176, 130.890045] };
  const CHECK = ['洗濯槽', '床・排水溝', 'ゴミ回収', '外観・駐車場', '備品確認'];
  const today = ds(new Date()), ym = ymOf(new Date()), pre = ym.replace('-', '/') + '/';
  const role = new URLSearchParams(location.search).get('role') || 'admin';
  const db = {
    staff: [
      ['本部 太郎', [], 'U0', '承認', 'admin'], ['スタッフA', ['水巻町店', '中間店'], 'U1', '承認', 'staff'],
      ['スタッフB', ['水巻町店'], 'U2', '承認', 'staff'], ['スタッフC', ['長府店'], 'U3', '承認', 'staff'], ['スタッフD', ['長府店'], 'U4', '申請中', 'staff'],
      ['スタッフE', ['星ヶ丘店', '頓野店'], 'U5', '承認', 'staff'], ['スタッフF', ['曽根店'], '', '未登録', 'staff'], ['スタッフG', ['中間店'], 'U6', '停止', 'staff'],   // 退職済み（過去の打刻だけ残る例）
      // 以下は名簿（Code.gs SEED_STAFF）の残り
      ['スタッフH', ['長府店'], 'U7', '承認', 'staff'], ['スタッフI', ['星ヶ丘店'], 'U8', '承認', 'staff'], ['スタッフJ', ['白銀店'], 'U9', '承認', 'staff'],
      ['スタッフK', ['白銀店'], 'U10', '承認', 'staff'], ['スタッフL', ['曽根店'], 'U11', '承認', 'staff'], ['スタッフM', ['下到津店'], 'U12', '承認', 'staff'],
      ['スタッフN', ['水巻町店'], 'U13', '承認', 'staff'], ['スタッフO', ['頓野店'], 'U14', '承認', 'staff'], ['スタッフP', ['宗像店'], 'U15', '承認', 'staff'],
      ['スタッフQ', ['宗像店'], 'U16', '承認', 'staff'], ['スタッフR', ['熊本町店'], 'U17', '承認', 'staff']
    ].map((s, i) => ({ row: i + 2, name: s[0], stores: s[1], userId: s[2], lineName: s[2] ? s[0].split(' ')[0] : '', status: s[3], role: s[4], registered: '2026/09/2' + (i % 9) })),
    punches: [], shifts: [], fixes: [{ id: 'f1', requested: today, staff: 'スタッフB', date: ds(new Date(Date.now() - 2 * 864e5)), store: '水巻町店', type: '退勤', time: '11:30', reason: '押し忘れ', status: '申請中' }],
    prevDays: { 'スタッフA|水巻町店': 8, 'スタッフA|中間店': 6, 'スタッフB|水巻町店': 9, 'スタッフC|長府店': 12, 'スタッフE|星ヶ丘店': 16, 'スタッフG|中間店': 8 }
  };
  // 今月のダミーシフト・打刻
  daysOf(ym).forEach((d, i) => {
    [['スタッフA', '水巻町店', 0], ['スタッフB', '水巻町店', 1], ['スタッフC', '長府店', 0], ['スタッフE', '星ヶ丘店', 1], ['スタッフG', '中間店', 0], ['スタッフA', '中間店', 1]].forEach(([n, st, odd]) => {
      if (i % 2 !== odd || (n === 'スタッフG' && d >= today)) return;   // 退職者は今日以降のシフトなし
      db.shifts.push({ date: d, store: st, staff: n, status: d > ds(new Date(Date.now() + 10 * 864e5)) ? '希望' : '確定' });
      if (d < today && !(n === 'スタッフG' && i === 4)) {
        const h = 9 + (i % 2);
        const g = GEO[st], far = n === 'スタッフB' && i === 9;   // 1件だけ約1.5km離れた打刻
        db.punches.push({ date: d, store: st, staff: n, type: '出勤', time: `${String(h).padStart(2, '0')}:0${i % 6}`, checks: '', kind: 'LIFF',
          lat: (g[0] + (far ? 0.0135 : 0.0003)).toFixed(5), lng: (g[1] + 0.0002).toFixed(5) });
        if (!(n === 'スタッフE' && i === 7)) db.punches.push({ date: d, store: st, staff: n, type: '退勤', time: `${String(h + 1).padStart(2, '0')}:${10 + i % 40}`, checks: i % 5 ? CHECK.join('、') : CHECK.slice(0, 3).join('、'), kind: 'LIFF' });
      }
    });
  });
  db.punches.push({ date: today, store: '水巻町店', staff: 'スタッフB', type: '出勤', time: '09:12', checks: '', kind: 'LIFF' });
  // demo_names.js（ローカル専用・GitHubには上げない）があれば、ダミー名を実名に置き換えて表示する
  if (window.DEMO_NAMES) {
    let j = JSON.stringify(db);
    Object.entries(window.DEMO_NAMES).forEach(([k, v]) => { j = j.split(k).join(v); });
    Object.assign(db, JSON.parse(j));
  }
  const me = () => role === 'staff' ? db.staff[1] : db.staff[0];
  const wait = v => new Promise(r => setTimeout(() => r(JSON.parse(JSON.stringify(v))), 250));
  const locked = y => ds(new Date()) > y.replace('-', '/') + '/10';
  const now = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
  const H = {
    me: () => ({ lineName: 'デモ', status: '承認', profile: { name: me().name, stores: me().stores, role: me().role }, config: { stores: STORES, checklist: CHECK, deadlineDay: 10, geo: GEO, geoRadius: 200 }, today }),
    home: () => ({ today, pendingFix: 0,
      stores: me().stores.map(st => ({ store: st, inTime: (db.punches.find(p => p.date === today && p.store === st && p.staff === me().name && p.type === '出勤') || {}).time || null,
        outTime: (db.punches.find(p => p.date === today && p.store === st && p.staff === me().name && p.type === '退勤') || {}).time || null,
        todayShift: db.shifts.filter(s => s.date === today && s.store === st && s.status === '確定').map(s => s.staff) })),
      upcoming: db.shifts.filter(s => s.staff === me().name && s.status === '確定' && s.date >= today).sort((a, b) => a.date > b.date ? 1 : -1).slice(0, 7) }),
    punch: p => {
      if (db.punches.some(x => x.date === today && x.store === p.store && x.staff === me().name && x.type === p.type)) return { message: p.type + 'は本日すでに記録済みです', duplicated: true };
      const t = now(); db.punches.push({ date: today, store: p.store, staff: me().name, type: p.type, time: t, checks: (p.checks || []).join('、'), kind: 'LIFF', lat: p.lat, lng: p.lng });
      return { message: today + ' ' + t + '　' + p.store + '　' + p.type + 'を記録しました（デモ）', time: t };
    },
    myMonth: p => { const pr = p.ym.replace('-', '/') + '/'; return { ym: p.ym, locked: locked(p.ym),
      punches: db.punches.filter(x => x.staff === me().name && x.date.startsWith(pr)), shifts: db.shifts.filter(x => x.staff === me().name && x.date.startsWith(pr)),
      fixes: db.fixes.filter(x => x.staff === me().name && x.date.startsWith(pr)) }; },
    submitShifts: p => {
      const pr = p.ym.replace('-', '/') + '/';
      db.shifts = db.shifts.filter(s => !(s.staff === me().name && s.store === p.store && s.date.startsWith(pr) && s.status === '希望' && !p.dates.includes(s.date)));
      p.dates.forEach(d => { if (!db.shifts.some(s => s.staff === me().name && s.store === p.store && s.date === d)) db.shifts.push({ date: d, store: p.store, staff: me().name, status: '希望' }); });
      return '希望シフトを提出しました（デモ）';
    },
    requestFix: p => { db.fixes.push({ id: 'f' + Date.now(), requested: today, staff: me().name, ...p, status: '申請中' }); return '修正申請を送りました（デモ）'; },
    adminData: p => { const pr = p.ym.replace('-', '/') + '/'; return { ym: p.ym, prevYm: addYm(p.ym, -1), today, stores: STORES, staff: db.staff,
      punches: db.punches.filter(x => x.date.startsWith(pr) || x.date === today), shifts: db.shifts.filter(x => x.date.startsWith(pr) || x.date === today),
      fixes: db.fixes, prevDays: p.ym === ym ? db.prevDays : {}, locked: locked(p.ym) }; },
    adminSaveStaff: p => {
      const s = db.staff.find(x => x.row === p.row);
      if (s) Object.assign(s, { name: p.name, stores: p.stores, status: p.unlink && p.status !== '停止' ? '未登録' : p.status, role: p.role }, p.unlink ? { userId: '', lineName: '' } : {});
      if (s && p.status === '停止' && p.dropFuture) {
        const n = db.shifts.length; db.shifts = db.shifts.filter(x => !(x.staff === p.name && x.date > today));
        return `保存しました（明日以降のシフト${n - db.shifts.length}件を削除・デモ）`;
      }
      if (!s) db.staff.push({ row: db.staff.length + 2, name: p.name, stores: p.stores, userId: '', lineName: '', status: '未登録', role: p.role, registered: '' });
      return '保存しました（デモ）';
    },
    adminSetShift: p => { const i = db.shifts.findIndex(x => x.date === p.date && x.store === p.store && x.staff === p.staff);
      if (p.status === '削除') { if (i >= 0) db.shifts.splice(i, 1); } else if (i >= 0) db.shifts[i].status = p.status; else db.shifts.push({ date: p.date, store: p.store, staff: p.staff, status: p.status }); return 'ok'; },
    adminBulkConfirm: p => { let n = 0; db.shifts.forEach(s => { if (s.status === '希望' && s.date.startsWith(p.ym.replace('-', '/') + '/') && (!p.store || s.store === p.store)) { s.status = '確定'; n++; } }); return n + '件を確定しました（デモ）'; },
    adminDecideFix: p => { const f = db.fixes.find(x => x.id === p.id); f.status = p.decision;
      if (p.decision === '承認') { const x = db.punches.find(q => q.date === f.date && q.store === f.store && q.staff === f.staff && q.type === f.type);
        if (x) { x.time = f.time; x.kind = '修正'; } else db.punches.push({ date: f.date, store: f.store, staff: f.staff, type: f.type, time: f.time, checks: '', kind: '修正' }); }
      return p.decision + 'しました（デモ）'; },
    adminPunch: p => { const i = db.punches.findIndex(q => q.date === p.date && q.store === p.store && q.staff === p.staff && q.type === p.type);
      if (!p.time) { if (i >= 0) db.punches.splice(i, 1); return '削除しました'; }
      if (i >= 0) { db.punches[i].time = p.time; db.punches[i].kind = '管理者入力'; } else db.punches.push({ date: p.date, store: p.store, staff: p.staff, type: p.type, time: p.time, checks: '', kind: '管理者入力' });
      return '保存しました（デモ）'; },
    adminWriteSummary: p => '「月次集計」シートに ' + p.ym + ' を出力しました（デモ）'
  };
  return { call: (a, p) => H[a] ? wait(H[a](p)) : Promise.reject(new Error('不明な操作: ' + a)) };
})();

boot();
</script>
